<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Investoyard</title>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f3f8; color: #16141f; display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
    .card { max-width: 360px; }
    .mark { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; border: 1px solid #e3e3e6; }
    h1 { font-size: 20px; margin: 18px 0 6px; }
    p { color: #5e5b6e; line-height: 1.5; }
    a { display: inline-block; margin-top: 16px; background: #3c2e7e; color: #fff; padding: 11px 22px; border-radius: 999px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="/icon.svg" alt="Investoyard" width="64" height="64" />
    <h1>You’re offline</h1>
    <p>Investoyard needs a connection to load fresh IPO data. Check your network and try again.</p>
    <a href="/">Retry</a>
  </div>
</body>
</html>
