<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, 'Segoe UI', sans-serif; }
    a { color: #3c2e7e; } a:hover { color: #2f2463; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; background: #f4f3f8; padding: 76px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <div style="width: 22px; height: 22px; border-radius: 6px; background: #ffcb32;"></div>
    <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: #3c2e7e;">Investoyard</div>
  </div>

  <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 80px; line-height: 1.02; letter-spacing: -0.035em; color: #16141f; text-wrap: balance;">The app only ever asks you to do one thing.</h1>

  <div style="background: #ffffff; border: 1px solid #e9e7f0; border-radius: 24px; box-shadow: 0 10px 28px rgba(28, 22, 60, 0.10), 0 3px 8px rgba(28, 22, 60, 0.06); overflow: hidden;">
    <sc-for list="{{stages}}" as="row" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 20px; padding: 24px 32px; border-bottom: 1px solid #f2f1f7;">

        <div style="width: 330px; flex: none;">
          <div style="display: inline-block; font-size: 23px; font-weight: 700; padding: 10px 20px; border-radius: 999px; background: {{row.chipBg}}; color: {{row.chipFg}};">{{row.stage}}</div>
        </div>

        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c3c0d2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none;" aria-hidden="true">
          <path d="M5 12h14"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>

        <div style="flex-grow: 1; display: flex; justify-content: flex-end;">
          <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 25px; font-weight: 700; color: #ffffff; background: #3c2e7e; padding: 13px 26px; border-radius: 12px;">{{row.cta}}</div>
        </div>

      </div>
    </sc-for>
  </div>

  <p style="margin: 0; font-size: 29px; line-height: 1.48; color: #5e5b6e;">No menus to hunt through. Whatever stage an IPO is at, the card shows the one action that makes sense — and the numbers that matter that day.</p>

  <div style="margin-top: auto; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 28px; font-weight: 700; color: #3c2e7e;">newipo.finwave.co</div>
    <div style="font-size: 21px; color: #5e5b6e;">Information only, not advice.</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stages: [
        { stage: 'Opening Soon',       cta: 'Remind Me',       chipBg: '#eeebfa', chipFg: '#3c2e7e' },
        { stage: 'Open Today',         cta: 'Apply Now',       chipBg: '#e6f4ec', chipFg: '#0e7a49' },
        { stage: 'Closing Today',      cta: 'Apply Now',       chipBg: '#fcebe8', chipFg: '#d8412a' },
        { stage: 'Awaiting Allotment', cta: 'Check Allotment', chipBg: '#eeebfa', chipFg: '#3c2e7e' },
        { stage: 'Allotment Out',      cta: 'Check Allotment', chipBg: '#fbf3df', chipFg: '#8a6200' },
        { stage: 'Listed',             cta: 'IPO Performance', chipBg: '#e3f2f5', chipFg: '#0e7c8a' },
      ],
    };
  }
}
</script>
</body>
</html>
