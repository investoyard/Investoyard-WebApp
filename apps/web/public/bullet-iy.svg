<!--
  Investoyard bullet mark — the full "IY" identity from icon_o.svg, on a
  transparent ground so it composes over any list background. Used as
  ::before on `.prose ul li` (web) and rendered via SvgXml on mobile as
  the leading glyph for each <li>.

  Design mirrors icon_o.svg (same viewBox, same paths, same gold + indigo)
  minus the white backing rect — that rect breaks bullet transparency.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Investoyard">
  <g transform="translate(52,52) scale(0.80)">
    <path d="M62 10 L118 104 L6 104 Z" fill="#ffcb32" stroke="#ffcb32" stroke-width="16" stroke-linejoin="round"/>
    <rect x="14" y="132" width="96" height="368" rx="10" fill="#3c2e7e"/>
    <path d="M350 8 L500 8 L425 176 Z" fill="#3c2e7e" stroke="#3c2e7e" stroke-width="16" stroke-linejoin="round"/>
    <polyline points="150,22 402,250 220,498" fill="none" stroke="#ffcb32" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
