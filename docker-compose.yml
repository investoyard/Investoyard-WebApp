# Local Postgres for Investoyard. `docker compose up -d` then run api migrations + seed.
services:
  db:
    image: postgres:16
    container_name: investoyard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investoyard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
