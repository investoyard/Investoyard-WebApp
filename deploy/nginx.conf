# Investoyard web — nginx: static Next.js export + same-origin /api proxy.
# The Host header is forwarded so per-domain white-label tenant resolution works.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets are immutable.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Same-origin API (web is built with NEXT_PUBLIC_API_URL=/api). Keep-alive off
  # long enough for the rail handshake test (10s) + submissions.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # Static export with trailingSlash: /ipos/ACME → /ipos/ACME/index.html.
  location / {
    try_files $uri $uri/index.html $uri.html /index.html;
  }
}
