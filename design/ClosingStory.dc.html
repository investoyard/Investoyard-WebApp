    <div style="width: 26px; height: 26px; border-radius: 7px; background: #ffcb32;"></div>
    <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.18em; text-transform: uppercase; color: #ffffff;">Investoyard</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 40px;">
    <div style="align-self: flex-start; background: #d8412a; border-radius: 12px; padding: 16px 28px;">
      <span style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff;">Closes today</span>

    <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 104px; line-height: 1.0; letter-spacing: -0.038em; color: #ffffff; text-wrap: balance;">Jio closes at 5 pm.</h1>

    <div style="background: rgba(255,255,255,0.10); border-radius: 22px; padding: 38px 40px; display: flex; flex-direction: column; gap: 22px;">

      <div style="font-size: 32px; line-height: 1.4; color: rgba(255,255,255,0.82);">Open your UPI app and approve it before the cutoff.</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px;">
    <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 34px; font-weight: 800; color: #ffcb32;">newipo.finwave.co</div>
    <div style="font-size: 22px; color: rgba(255,255,255,0.62);">Information only, not advice.</div>
  </div>

</div>
