<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, 'Segoe UI', sans-serif; }
    a { color: #3c2e7e; } a:hover { color: #2f2463; }
  </style>
</helmet>

<!-- The UP variant. ListingDown is identical but for the semantic colour and
     the word, deliberately: publishing a weak listing on the same template at
     the same hour is the whole point. -->
<div style="width: 1080px; height: 1350px; background: #f4f3f8; padding: 76px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 34px;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 22px; height: 22px; border-radius: 6px; background: #ffcb32;"></div>
      <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: #3c2e7e;">Investoyard</div>
    </div>
    <div style="background: #e3f2f5; color: #0e7c8a; font-size: 21px; font-weight: 700; padding: 10px 22px; border-radius: 999px;">Listed</div>
  </div>

  <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 76px; line-height: 1.02; letter-spacing: -0.035em; color: #16141f;">Jio Platforms</h1>

  <div style="background: #ffffff; border: 1px solid #e9e7f0; border-radius: 24px; box-shadow: 0 10px 28px rgba(28, 22, 60, 0.10), 0 3px 8px rgba(28, 22, 60, 0.06); padding: 40px; display: flex; flex-direction: column; gap: 30px;">

    <div style="display: flex; align-items: center; gap: 22px;">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#12925a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none;" aria-hidden="true">
        <path d="M7 17 17 7"></path><path d="M9 7h8v8"></path>
      </svg>
      <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 104px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: #12925a; font-variant-numeric: tabular-nums;">[X]%</div>
    </div>

    <div style="height: 1px; background: #f2f1f7;"></div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 19px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #5e5b6e;">Listed at</div>
        <div style="font-size: 40px; font-weight: 700; color: #16141f; font-variant-numeric: tabular-nums;">₹[PRICE]</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 19px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #5e5b6e;">Issue price</div>
        <div style="font-size: 40px; font-weight: 700; color: #16141f; font-variant-numeric: tabular-nums;">₹[BAND MAX]</div>
      </div>
    </div>

  </div>

  <p style="margin: 0; font-size: 29px; line-height: 1.42; color: #5e5b6e; max-width: 880px;">We publish every listing on the same template, whichever way it went.</p>

  <div style="margin-top: auto; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 28px; font-weight: 700; color: #3c2e7e;">newipo.finwave.co/performance</div>
    <div style="font-size: 21px; color: #5e5b6e;">Information only, not advice.</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
